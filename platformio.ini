; PlatformIO (VS Code): Build = ✓, Upload = →, Serial Monitor = 🔌 în bara de jos.
; Sketch-ul rămâne în rădăcina proiectului, ca să meargă în continuare și din Arduino IDE.

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
; espressif32 8.x = core-ul Arduino-ESP32 3.x
platform = espressif32@^8.0.0
board = esp32dev
framework = arduino
build_src_filter = +<*.ino> +<*.cpp> +<*.h> -<.pio/> -<.git/>
lib_deps =
    pololu/VL53L0X@^1.3.1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
